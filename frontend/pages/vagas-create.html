<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Vagas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #1c1c1e;
            color: #e5e5ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #2c2c2e;
            border-radius: 6px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: #f5f5f7;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, select, textarea {
            padding: 12px;
            border-radius: 4px;
            border: none;
            background-color: #3a3a3c;
            color: #f5f5f7;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s ease;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #636366;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #0a84ff;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0066cc;
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }

            input, select, textarea, button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cadastro de Vaga</h1>
        <form id="vagaForm">
            <input type="text" name="titulo" placeholder="Título da vaga" required>
            <textarea name="descricao" placeholder="Descrição da vaga"></textarea>
            <select name="tipo" required>
                <option value="">Selecione o tipo</option>
                <option value="CLT">CLT</option>
                <option value="PJ">PJ</option>
                <option value="Freelancer">Freelancer</option>
            </select>
            <select name="status" required>
                <option value="active">Ativa</option>
                <option value="paused">Pausada</option>
                <option value="closed">Fechada</option>
            </select>
            <button type="submit">Cadastrar Vaga</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('vagaForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const formData = {
                titulo: form.titulo.value,
                descricao: form.descricao.value,
                tipo: form.tipo.value,
                status: form.status.value
            };

            console.log('Dados da vaga:', formData);

            // Aqui você pode enviar para sua API via fetch:
            // fetch('http://localhost:8080/cadastro_vaga.php', { method: 'POST', body: JSON.stringify(formData), headers: { 'Content-Type': 'application/json' } })
            //     .then(res => res.json())
            //     .then(data => console.log(data))
            //     .catch(err => console.error(err));
            
            alert('Vaga cadastrada com sucesso! (simulação)');
            form.reset();
        });
    </script>
</body>
</html>

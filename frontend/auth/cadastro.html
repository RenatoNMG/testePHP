<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1c1c1e;
        }

        .card {
            background-color: #2c2c2e;
            border-radius: 4px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #e5e5ea;
        }

        .card h2 {
            margin-bottom: 25px;
            font-weight: 500;
            color: #f5f5f7;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 12px 15px;
            border-radius: 4px;
            border: none;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
            background-color: #3a3a3c;
            color: #f5f5f7;
        }

        input::placeholder {
            color: #a1a1a6;
        }

        input:focus {
            outline: 2px solid #636366;
            background-color: #3a3a3c;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper svg {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: default;
            fill: #a1a1a6;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #0a84ff;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0066cc;
        }

        .login-link {
            margin-top: 15px;
            font-size: 14px;
            color: #c7c7cc;
        }

        .login-link a {
            color: #0a84ff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #0066cc;
        }

        @media (max-width: 500px) {
            .card {
                padding: 30px 20px;
            }
            input, button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastro de Candidato</h2>
        <form>
            <input type="text" name="nome" placeholder="Nome Completo" required>
            <input type="email" name="email" placeholder="seuemail@dominio.com" required>
            <div class="password-wrapper">
                <input type="password" name="senha" placeholder="Senha" required>
                <!-- Ícone de olho apenas visual -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path d="M12 5c-7.633 0-12 6.445-12 7s4.367 7 12 7 12-6.445 12-7-4.367-7-12-7zm0 12c-3.313 0-6-2.686-6-6s2.687-6 6-6 6 2.686 6 6-2.687 6-6 6zm0-10c-2.206 0-4 1.794-4 4s1.794 4 4 4 4-1.794 4-4-1.794-4-4-4z"/></svg>
            </div>
            <input type="password" name="confirmar_senha" placeholder="Confirmar Senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <div class="login-link">
            Já tem uma conta? <a href="login.html">Faça Login</a>
        </div>
    </div>
</body>
</html>

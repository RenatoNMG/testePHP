<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato</title>
    <link rel="stylesheet" href="../styles/layouts/auth.css">
    <script src="../services/authService.js"></script>
</head>

<body>
    <div class="card">
        <h2>Cadastro de Candidato</h2>
        <form>
            <input type="text" name="nome" placeholder="Nome Completo" required>
            <input type="email" name="email" placeholder="seuemail@dominio.com" required>
            <div class="password-wrapper">
                <input type="password" name="senha" placeholder="Senha" required>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                    <path
                        d="M12 5c-7.633 0-12 6.445-12 7s4.367 7 12 7 12-6.445 12-7-4.367-7-12-7zm0 12c-3.313 0-6-2.686-6-6s2.687-6 6-6 6 2.686 6 6-2.687 6-6 6zm0-10c-2.206 0-4 1.794-4 4s1.794 4 4 4 4-1.794 4-4-1.794-4-4-4z" />
                </svg>
            </div>
            <input type="password" name="confirmar_senha" placeholder="Confirmar Senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <div class="login-link">
            Já tem uma conta? <a href="login.html">Faça Login</a>
        </div>
    </div>
</body>

</html>
